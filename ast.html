<!DOCTYPE html>

<style>

, "children": []}, {"kind": "Var", "name": "Var: k", "line": 38, "children": []}]}, {"kind": "Assign", "name": "Assign: counter", "line": 38, "children": [{"kind": "BinOp", "name": "BinOp: +", "line": 38, "children": [{"kind": "Var", "name": "Var: counter", "line": 38, "children": []}, {"kind": "Num", "name": "Num: 1 <int>", "line": 38, "children": []}]}]}]}]}]}]}, {"kind": "Print", "name": "Print", "line": 40, "children": [{"kind": "Str", "name": "Str: primes found:", "line": 40, "children": []}, {"kind": "Var", "name": "Var: counter", "line": 40, "children": []}]}, {"kind": "Print", "name": "Print", "line": 41, "children": [{"kind": "Str", "name": "Str: avg =", "line": 41, "children": []}, {"kind": "Call", "name": "Call: average", "line": 41, "children": [{"kind": "Num", "name": "Num: 3 <int>", "line": 41, "children": []}, {"kind": "Num", "name": "Num: 4 <int>", "line": 41, "children": []}]}]}, {"kind": "Print", "name": "Print", "line": 42, "children": [{"kind": "Str", "name": "Str: -7 / 2 =", "line": 42, "children": []}, {"kind": "BinOp", "name": "BinOp: /", "line": 42, "children": [{"kind": "UnOp", "name": "UnOp: -", "line": 42, "children": [{"kind": "Num", "name": "Num: 7 <int>", "line": 42, "children": []}]}, {"kind": "Num", "name": "Num: 2 <int>", "line": 42, "children": []}]}, {"kind": "Str", "name": "Str:  -7 % 3 =", "line": 42, "children": []}, {"kind": "BinOp", "name": "BinOp: %", "line": 42, "children": [{"kind": "UnOp", "name": "UnOp: -", "line": 42, "children": [{"kind": "Num", "name": "Num: 7 <int>", "line": 42, "children": []}]}, {"kind": "Num", "name": "Num: 3 <int>", "line": 42, "children": []}]}]}, {"kind": "VarDecl", "name": "VarDecl: x <int>", "line": 43, "children": [{"kind": "Num", "name": "Num: 5 <int>", "line": 43, "children": []}]}, {"kind": "If", "name": "If", "line": 44, "children": [{"kind": "BinOp", "name": "BinOp: >", "line": 44, "children": [{"kind": "Var", "name": "Var: x", "line": 44, "children": []}, {"kind": "Num", "name": "Num: 3 <int>", "line": 44, "children": []}]}, {"kind": "If", "name": "If", "line": 44, "children": [{"kind": "BinOp", "name": "BinOp: >", "line": 44, "children": [{"kind": "Var", "name": "Var: x", "line": 44, "children": []}, {"kind": "Num", "name": "Num: 10 <int>", "line": 44, "children": []}]}, {"kind": "Print", "name": "Print", "line": 44, "children": [{"kind": "Str", "name": "Str: big", "line": 44, "children": []}]}, {"kind": "Print", "name": "Print", "line": 44, "children": [{"kind": "Str", "name": "Str: medium", "line": 44, "children": []}]}]}]}, {"kind": "Return", "name": "Return", "line": 45, "children": [{"kind": "Num", "name": "Num: 0 <int>", "line": 45, "children": []}]}]}]}]}, "source": "// Демо: факторіал, Фібоначчі, прості числа, dangling else\nint counter = 0;\n\nint fact(int n) {\n    if (n <= 1) return 1;\n    return n * fact(n - 1);\n}\n\nint fib(int n) {\n    int a = 0;\n    int b = 1;\n    for (int i = 0; i < n; i = i + 1) {\n        int t = a + b;\n        a = b;\n        b = t;\n    }\n    return a;\n}\n\nint is_prime(int n) {\n    if (n < 2) return 0;\n    int d = 2;\n    while (d * d <= n) {\n        if (n % d == 0) return 0;\n        d = d + 1;\n    }\n    return 1;\n}\n\nfloat average(int a, int b) {\n    return (a + b) / 2.0;\n}\n\nint main() {\n    print(\"fact(6) =\", fact(6));\n    print(\"fib(10) =\", fib(10));\n    for (int k = 1; k <= 20; k = k + 1) {\n        if (is_prime(k)) { print(\"prime:\", k); counter = counter + 1; }\n    }\n    print(\"primes found:\", counter);\n    print(\"avg =\", average(3, 4));\n    print(\"-7 / 2 =\", -7 / 2, \" -7 % 3 =\", -7 % 3);\n    int x = 5;\n    if (x > 3) if (x > 10) print(\"big\"); else print(\"medium\"); // else -> до внутрішнього if\n    return 0;\n}\n", "output": "fact(6) = 720\nfib(10) = 55\nprime: 2\nprime: 3\nprime: 5\nprime: 7\nprime: 11\nprime: 13\nprime: 17\nprime: 19\nprimes found: 8\navg = 3.5\n-7 / 2 = -3  -7 % 3 = -1\nmedium", "python": "import sys\ndef _div(a, b):\n    if isinstance(a, int) and isinstance(b, int):\n        q = abs(a) // abs(b)\n        return q if (a < 0) == (b < 0) else -q\n    return a / b\ndef _mod(a, b):\n    return a - b * _div(a, b)\ndef _print(*a):\n    print(*a)\n\ncounter = int(0)\n\ndef fact(n):\n    global counter\n    if int(n <= 1):\n        return 1\n    return (n * fact((n - 1)))\n\ndef fib(n):\n    global counter\n    a = int(0)\n    b = int(1)\n    i = int(0)\n    while int(i < n):\n        t = int((a + b))\n        a = b\n        b = t\n        i = (i + 1)\n    return a\n\ndef is_prime(n):\n    global counter\n    if int(n < 2):\n        return 0\n    d = int(2)\n    while int((d * d) <= n):\n        if int(_mod(n, d) == 0):\n            return 0\n        d = (d + 1)\n    return 1\n\ndef average(a, b):\n    global counter\n    return _div((a + b), 2.0)\n\ndef main():\n    global counter\n    _print('fact(6) =', fact(6))\n    _print('fib(10) =', fib(10))\n    k = int(1)\n    while int(k <= 20):\n        if is_prime(k):\n            _print('prime:', k)\n            counter = (counter + 1)\n        k = (k + 1)\n    _print('primes found:', counter)\n    _print('avg =', average(3, 4))\n    _print('-7 / 2 =', _div((-7), 2), ' -7 % 3 =', _mod((-7), 3))\n    x = int(5)\n    if int(x > 3):\n        if int(x > 10):\n            _print('big')\n        else:\n            _print('medium')\n    return 0\n\nif __name__ == \"__main__\":\n    main()\n"};

document.getElementById("out").textContent = DATA.output;
document.getElementById("py").textContent = DATA.python;
const color = {Program:"#6e6e73",FuncDef:"#0a84ff",Params:"#5e9cff",Param:"#5e9cff",Block:"#8e8e93",
 VarDecl:"#30b0c7",Assign:"#30b0c7",If:"#ff9f0a",While:"#ff9f0a",For:"#ff9f0a",Return:"#ff453a",Print:"#bf5af2",

const svg = d3.select("svg"), g = svg.append("g").attr("transform","translate(60,40)");
svg.call(d3.zoom().scaleExtent([0.1,4]).on("zoom",e=>g.attr("transform",e.transform)));
const root = d3.hierarchy(DATA.ast);
root.each(d=>d.id=Math.random());
const tree = d3.tree().nodeSize([22,200]);
function update(){
  tree(root);
  const nodes = root.descendants(), links = root.links();
  g.selectAll(".link").data(links,d=>d.target.id).join("path").attr("class","link")
   .attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
  const n = g.selectAll(".n").data(nodes,d=>d.id).join(e=>{
    const x=e.append("g").attr("class","n").style("cursor","pointer").on("click",(ev,d)=>{
      if(d.children){d._c=d.children;d.children=null}else if(d._c){d.children=d._c;d._c=null}update();});
    x.append("circle").attr("r",6);x.append("text").attr("dy",4);return x;});
  n.attr("transform",d=>`translate(${d.y},${d.x})`);
  n.select("circle").attr("fill",d=>color[d.data.kind]||"#999").attr("stroke",d=>d._c?"#000":"none").attr("stroke-width",2);
  n.select("text").attr("x",d=>d.children||d._c?-10:10).attr("text-anchor",d=>d.children||d._c?"end":"start")
   .text(d=>d.data.name);
  n.selectAll("title").data(d=>[d]).join("title").text(d=>"рядок "+d.data.line);
}
document.getElementById("exp").onclick=()=>{root.each(d=>{if(d._c){d.children=d._c;d._c=null}});update()};
document.getElementById("col").onclick=()=>{root.each(d=>{if(d.depth>=2&&d.children){d._c=d.children;d.children=null}});update()};
document.getElementById("col").click();
</script></body></html>
